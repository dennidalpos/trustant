name: Published image smoke test

on:
  workflow_dispatch:
    inputs:
      digest:
        description: SHA-256 index digest of the published ghcr.io/dennidalpos/trustant image
        type: string
        required: true
        default: sha256:7c40ce8e6873dc70ed54ce790b2f110ba8b2a7ba7773575f941dca96aca07243

permissions: {}

jobs:
  smoke:
    name: Image smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      DIGEST: ${{ inputs.digest }}
      ARCH: ${{ matrix.arch }}
      CONTAINER: trustant-image-smoke

    steps:
      - name: Start the published image on its native architecture
        shell: bash
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Expected a SHA-256 image digest' >&2
            exit 1
          fi
          test "$(dpkg --print-architecture)" = "$ARCH"
          image="ghcr.io/dennidalpos/trustant@$DIGEST"
          docker pull --platform "linux/$ARCH" "$image"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "linux/$ARCH"
          docker run --detach --name "$CONTAINER" --publish 127.0.0.1:8910:8910 "$image"

      - name: Check the Trustant and Ollama APIs
        shell: bash
        run: |
          curl --silent --show-error --fail --retry 40 --retry-all-errors --retry-delay 3 \
            --max-time 5 -H 'Host: trustant.localhost' http://127.0.0.1:8910/api/version |
            jq -e '.version | startswith("Trustant ")'
          docker exec "$CONTAINER" curl --silent --show-error --fail --retry 20 \
            --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:11434/api/version

      - name: Compare running binary versions with the image dependency register
        shell: bash
        run: |
          docker exec "$CONTAINER" cat /usr/share/doc/trustant/DEPS > "$RUNNER_TEMP/image-deps"
          gh_expected=$(awk '$1 == "gh" && $2 == "(GitHub" { print $4; exit }' "$RUNNER_TEMP/image-deps")
          ollama_expected=$(awk '$1 == "ollama" { print $2; exit }' "$RUNNER_TEMP/image-deps")
          mcp_expected=$(awk '$1 == "mcp-s3" { print $2; exit }' "$RUNNER_TEMP/image-deps")

          gh_version=$(docker exec "$CONTAINER" gh --version | awk 'NR == 1 { print $3 }')
          ollama_version=$(docker exec "$CONTAINER" curl --silent --show-error --fail \
            --max-time 5 http://127.0.0.1:11434/api/version | jq -er '.version')
          # mcp-s3 reports the compiled version in its MCP initialization response.
          mcp_version=$(python3 - <<'PY'
          import json
          import os
          import select
          import subprocess

          request = {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2024-11-05",
                  "capabilities": {},
                  "clientInfo": {"name": "image-smoke", "version": "1"},
              },
          }
          with subprocess.Popen(
              ["docker", "exec", "-i", "-e", "AWS_REGION=us-east-1", "-e",
               "AWS_EC2_METADATA_DISABLED=true", os.environ["CONTAINER"],
               "/usr/local/bin/mcp-s3-real"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True,
          ) as process:
              try:
                  process.stdin.write(json.dumps(request) + "\n")
                  process.stdin.flush()
                  ready, _, _ = select.select([process.stdout], [], [], 15)
                  if not ready:
                      raise SystemExit("mcp-s3 initialization timed out")
                  response = json.loads(process.stdout.readline())
                  server = response.get("result", {}).get("serverInfo", {})
                  if response.get("id") != 1 or server.get("name") != "mcp-s3":
                      raise SystemExit(f"Unexpected MCP initialization response: {response}")
                  print(server["version"])
              finally:
                  process.terminate()
          PY
          )

          printf 'gh: %s (DEPS %s)\nOllama: %s (DEPS %s)\nmcp-s3: %s (DEPS %s)\n' \
            "$gh_version" "$gh_expected" "$ollama_version" "$ollama_expected" "$mcp_version" "$mcp_expected"
          [[ -n "$gh_expected" && "$gh_version" == "$gh_expected" ]]
          [[ -n "$ollama_expected" && "$ollama_version" == "$ollama_expected" ]]
          [[ -n "$mcp_expected" && "$mcp_version" == "$mcp_expected" ]]

      - name: Run a streamed completion on the native ARM64 Ollama runner
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          docker exec "$CONTAINER" ollama pull smollm2:135m
          docker exec "$CONTAINER" curl --silent --show-error --fail --no-buffer --max-time 180 \
            -H 'Content-Type: application/json' --data \
            '{"model":"smollm2:135m","messages":[{"role":"user","content":"Say hello in five words."}],"stream":true,"max_tokens":24}' \
            http://127.0.0.1:11434/v1/chat/completions > "$RUNNER_TEMP/completion.sse"
          sed -n 's/^data: //p' "$RUNNER_TEMP/completion.sse" > "$RUNNER_TEMP/completion.data"
          test "$(tail -n 1 "$RUNNER_TEMP/completion.data")" = '[DONE]'
          sed '$d' "$RUNNER_TEMP/completion.data" | jq -es '
            [.[].choices[]?] |
            any(.delta.content? // "" | length > 0) and
            (.[-1].finish_reason | . == "stop" or . == "length")'

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          if docker container inspect "$CONTAINER" > /dev/null 2>&1; then
            docker logs --tail 160 "$CONTAINER"
          fi

      - name: Stop the test container
        if: always()
        shell: bash
        run: |
          if docker container inspect "$CONTAINER" > /dev/null 2>&1; then
            docker rm --force "$CONTAINER"
          fi
