name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Go packages
        run: |
          umask 022
          printf 'Version: %s\n' "$(cat version.txt)" > _build.txt
          go test ./...

  node:
    name: Node (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test tutorial fixtures
        run: npm run test:tutorial
      - name: Test and build TruACP
        working-directory: acp
        run: |
          npm ci
          package_dir="$(mktemp -d)"
          pi_ai="$(grep '^@earendil-works/pi-ai@' pi.version)"
          archive="$(npm pack "$pi_ai" --ignore-scripts --pack-destination "$package_dir" --silent)"
          tar -xzf "$package_dir/$archive" -C "$package_dir"
          TRUSTANT_PI_AI_PACKAGE="$package_dir/package" npm test
          npm run build
      - name: Test Pi ACP
        working-directory: acp/pi-acp
        run: |
          npm ci
          npm test
      - name: Check React MCP
        working-directory: react-mcp
        run: |
          npm ci
          npm run typecheck
          npm test
